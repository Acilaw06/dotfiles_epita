# --- Moteur graphique et performances ---
backend = "xrender";
vsync = true;

# Évite les micro-saccades et les problèmes de rafraîchissement
use-damage = true; 

# --- Ombres (Shadows) ---
shadow = false;
shadow-radius = 12;
shadow-offset-x = -12;
shadow-offset-y = -12;
shadow-opacity = 0.5;

# Exclure les barres des tâches ou notifications des ombres
shadow-exclude = [
    "name = 'Notification'",
    "class_g = 'Conky'",
    "class_g = 'Polybar'"
];

# --- Effet de fondu (Fading) ---
fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 5;

# --- Opacité (Transparency) ---
inactive-opacity = 1.0;
frame-opacity = 0.8;
inactive-opacity-override = false;

# --- Coins arrondis (Optionnel) ---
corner-radius = 10; 

# --- Détection automatique ---
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;

# --- Types de fenêtres ---
wintypes:
{
  tooltip = { fade = true; shadow = false; opacity = 0.85; focus = true; };
  dock = { shadow = false; clip-shadow-above = true; };
  dnd = { shadow = false; };
  popup_menu = { opacity = 0.9; };
  dropdown_menu = { opacity = 0.9; };
};

